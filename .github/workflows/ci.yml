name: CI

on:
  push:
    branches: [main, feat/electronic-literature-agent]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Prepare non-secret CI environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env

      - name: Validate LangGraph configuration
        run: langgraph validate -c langgraph.json

      - name: Run offline regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          --ignore=src/legacy/tests/test_report_quality.py

      - name: Validate Docker Compose
        run: APP_IMAGE=deep-research:ci docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: deep-research:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

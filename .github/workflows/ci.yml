name: CI

on:
  push:
    branches: [main, feat/electronic-literature-agent]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Prepare non-secret CI environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env

      - name: Validate LangGraph configuration
        run: langgraph validate -c langgraph.json

      - name: Validate Docker Compose
        run: APP_IMAGE=deep-research:ci docker compose config --quiet

  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: academic
            paths: tests/test_academic_tools.py tests/test_semantic_scholar.py
          - suite: local-rag
            paths: tests/test_local_pdf_tools.py tests/test_retrieval_evaluation.py tests/test_local_pdf_evaluation_cli.py
          - suite: report-cli-write
            paths: tests/test_run_research_report.py::test_run_writes_final_report_and_passes_configuration
          - suite: report-cli-empty
            paths: tests/test_run_research_report.py::test_run_rejects_empty_final_report
          - suite: report-cli-parser
            paths: tests/test_run_research_report.py::test_parser_defaults_to_hybrid_output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run ${{ matrix.suite }} regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider ${{ matrix.paths }}

  container:
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: deep-research:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
